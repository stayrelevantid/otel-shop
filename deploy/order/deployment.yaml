apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: otel-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order
          image: otel-shop/order:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
              name: http
          env:
            - name: PORT
              value: "18080"
            - name: INVENTORY_URL
              value: http://inventory-service:18081
            - name: PAYMENT_URL
              value: http://payment-service:18082
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector:14317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10